<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search visualizer</title><style>body{font:16px system-ui;padding:1rem;color:#243447}.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:.4rem}.row{display:flex;gap:.35rem;flex-wrap:wrap;margin:1rem 0}.cell{padding:.3rem;min-width:2rem;display:flex;align-items:flex-end;justify-content:center;border:1px solid #9aaabd;border-radius:.3rem}.active{background:#167ac6;color:#fff}.discard{opacity:.25}.found{background:#2b8a3e;color:#fff}.stats{display:flex;gap:1rem}.status{min-height:2rem}</style></head><body><h1>Search visualizer</h1><div class="toolbar"><label for="algorithm">Algorithm</label><select id="algorithm"><option value="linear">Linear search</option><option value="binary">Binary search</option></select><button id="play" type="button">Play</button><button id="back" type="button">Step back</button><button id="forward" type="button">Step forward</button><button id="reset" type="button">Reset</button><label for="speed">Speed <input id="speed" type="range" min="1" max="100" value="60"></label></div><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub through steps"><div class="stats"><span>Step: <strong id="step">0 / 0</strong></span><span>Comparisons: <strong id="count">0</strong></span></div><div class="row" id="values"></div><p class="status" id="status" role="status" aria-live="polite"></p><script>const values=[1,2,3,4,5,6,7,8,9],$=id=>document.getElementById(id);let steps=[],current=-1,playing=false,timer;function makeSteps(name){const r=[];if(name==='linear'){for(let i=0;i<values.length;i++){r.push({indices:[i],message:'Compare index '+i+' with 7'});if(values[i]===7){r.push({indices:[i],found:i,message:'Found 7 at index '+i});break}}}else{let low=0,high=values.length-1;while(low<=high){const m=Math.floor((low+high)/2);r.push({indices:[m],low,high,message:'Compare middle index '+m+'; active range is '+low+' through '+high});if(values[m]===7){r.push({indices:[m],found:m,message:'Found 7 at index '+m});break}if(values[m]<7)low=m+1;else high=m-1}}return r}function render(){const item=steps[current],discarded=item&&$('algorithm').value==='binary'?values.map((_,i)=>i).filter(i=>i<item.low||i>item.high):[];$('values').replaceChildren(...values.map((v,i)=>{const c=document.createElement('span');c.className='cell';c.textContent=v;c.style.height=(v*1.8+1)+'rem';if(item?.indices.includes(i))c.classList.add(item.found===i?'found':'active');if(discarded.includes(i))c.classList.add('discard');return c}));$('step').textContent=Math.max(0,current+1)+' / '+steps.length;$('count').textContent=Math.max(0,current+1);$('status').textContent=item?.message||'Choose an algorithm, then play or step through it.';$('scrub').value=Math.max(0,current+1)}function pause(){playing=false;clearTimeout(timer);$('play').textContent='Play'}function go(i){current=Math.max(-1,Math.min(i,steps.length-1));render();if(current>=steps.length-1)pause()}function play(){if(playing){pause();return}playing=true;$('play').textContent='Pause';const tick=()=>{if(!playing)return;if(current>=steps.length-1){pause();return}go(current+1);timer=setTimeout(tick,620-Number($('speed').value)*6)};tick()}function reset(){pause();steps=makeSteps($('algorithm').value);current=-1;$('scrub').max=steps.length;render()}$('algorithm').onchange=reset;$('play').onclick=play;$('back').onclick=()=>{pause();go(current-1)};$('forward').onclick=()=>{pause();go(current+1)};$('reset').onclick=reset;$('scrub').oninput=()=>go(Number($('scrub').value)-1);reset();</script></body></html>
