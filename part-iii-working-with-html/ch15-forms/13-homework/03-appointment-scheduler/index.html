<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appointment scheduler homework</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main>
        <h1>Schedule an appointment</h1>
        <form id="appointment-form" novalidate>
            <label for="date">Date</label>
            <input id="date" type="date" aria-label="Appointment date">
            <label for="time">Time</label>
            <input id="time" type="time" aria-label="Appointment time">
            <fieldset>
                <legend>Meeting type</legend>
                <label><input type="radio" name="meeting" value="in person" aria-label="In person" checked> In
                    person</label>
                <label><input type="radio" name="meeting" value="video" aria-label="Video call"> Video call</label>
            </fieldset>
            <label><input id="reminder" type="checkbox" aria-label="Send reminder"> Send reminder</label>
            <button type="submit">Schedule</button>
        </form>
        <p id="status" role="status" aria-live="polite">Choose a date and time.</p>
    </main>
</body>

</html>
