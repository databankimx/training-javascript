<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form validation</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main>
        <h1>Order details</h1>
        <form id="order-form" novalidate>
            <label for="name">Name</label>
            <input id="name" name="name" aria-label="Name">
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" aria-label="Quantity" min="1">
            <label for="price">Price</label>
            <input id="price" name="price" type="number" aria-label="Price" min="0" step="0.01">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" aria-label="Email">
            <button type="submit">Calculate order</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
    </main>
</body>

</html>
