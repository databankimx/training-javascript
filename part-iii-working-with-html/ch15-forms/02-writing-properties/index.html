<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Writing form-control properties</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main>
        <h1>Update preferences</h1>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" aria-label="Email address" value="ada@example.com">
        <label><input id="updates" type="checkbox" aria-label="Receive updates"> Receive updates</label>
        <button id="save" type="button">Save preferences</button>
        <button id="prepare" type="button">Prepare example</button>
        <p id="status" role="status" aria-live="polite">Nothing changed yet.</p>
    </main>
</body>

</html>
