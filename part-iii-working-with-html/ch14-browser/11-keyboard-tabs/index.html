<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keyboard tabs</title><link rel="stylesheet" href="style.css"><script src="main.js" defer></script></head><body><main><h1>Keyboard-friendly tabs</h1><div id="tabs" class="tabs" role="tablist" aria-label="Sections"><button id="one" role="tab" aria-selected="true" aria-controls="one-panel" type="button">One</button><button id="two" role="tab" aria-selected="false" aria-controls="two-panel" type="button">Two</button><button id="three" role="tab" aria-selected="false" aria-controls="three-panel" type="button">Three</button></div><section id="one-panel" role="tabpanel" aria-labelledby="one"><p>Use Left and Right Arrow to move between tabs.</p></section><section id="two-panel" role="tabpanel" aria-labelledby="two" hidden><p>The focused tab is also selected.</p></section><section id="three-panel" role="tabpanel" aria-labelledby="three" hidden><p>Focus should never become a scavenger hunt.</p></section></main></body></html>
