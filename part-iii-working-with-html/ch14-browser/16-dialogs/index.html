<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Note dialog</title><link rel="stylesheet" href="style.css"><script src="main.js" defer></script></head>
<body><main><h1>Accounting notes</h1><button id="open" type="button">Add Note</button><ul id="notes" aria-label="Accounting notes"></ul><dialog id="note-dialog"><form method="dialog" id="note-form"><label for="note">Note</label><textarea id="note" aria-label="Note"></textarea><div><button value="cancel" type="submit">Cancel</button><button id="save" value="save" type="submit">Save note</button></div></form></dialog></main></body></html>
