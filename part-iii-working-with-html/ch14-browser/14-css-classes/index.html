<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changing CSS classes</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <h1 id="message">A plain message</h1>
    <button id="toggle" type="button">Highlight message</button>
    <p id="state" aria-live="polite">The message is plain.</p>
  </main>
</body>
</html>
