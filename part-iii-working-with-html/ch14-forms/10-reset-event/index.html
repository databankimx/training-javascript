<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetting a form</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main>
        <h1>Search settings</h1>
        <form id="search-form">
            <label for="term">Search term</label>
            <input id="term" name="term" aria-label="Search term">
            <label><input id="exact" name="exact" type="checkbox" aria-label="Exact match"> Exact match</label>
            <button type="submit">Search</button>
            <button type="reset">Reset</button>
        </form>
        <p id="status" role="status" aria-live="polite">Ready.</p>
    </main>
</body>

</html>
