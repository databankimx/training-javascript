<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shipping estimate homework</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main>
        <h1>Shipping estimate</h1>
        <label for="weight">Package weight</label>
        <input id="weight" type="number" aria-label="Package weight" value="2" min="0" step="0.1">
        <label for="speed">Shipping speed</label>
        <select id="speed" aria-label="Shipping speed">
            <option value="5">Ground</option>
            <option value="12">Two day</option>
            <option value="25">Overnight</option>
        </select>
        <button id="estimate" type="button">Estimate shipping</button>
        <p id="status" role="status" aria-live="polite">Enter a weight and choose a speed.</p>
    </main>
</body>

</html>
